kind = "api"
previewPath = "/api"
title = "Agentic GTM Factory API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python3 -u -m uvicorn main:app --host 0.0.0.0 --port 8080"

[services.production]

[services.production.run]
args = ["python3", "-m", "uvicorn", "main:app", "--app-dir", "artifacts/fastapi-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/healthz"
